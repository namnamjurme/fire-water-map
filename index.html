<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>소방용수 관리지도</title>
<meta name="theme-color" content="#c4302b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="소방용수지도">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#f3f5f4; --surface:#ffffff; --surface2:#eaeeed; --ink:#18201f; --ink2:#55615f; --line:#d3dad8;
  --accent:#c4302b; --accent-ink:#ffffff;
  --land:#eef1ee; --block:#e1e6e2; --road1:#ffffff; --road2:#f9faf9; --roadcase:#c5cdc9; --river:#b9d3e4;
  --g1:#1d6fd1; --g2:#2e9a55; --g3:#e3b50d; --g4:#ffffff; --g4ink:#d1262b; --gx:#ffffff; --gxink:#111111;
  --ring:#111111; --warn:#b36b00; --danger:#c4302b; --ok:#2e7d4f;
  --font:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,-apple-system,sans-serif;
  --mono:ui-monospace,"IBM Plex Mono",Menlo,Consolas,monospace;
  --shadow:0 -6px 24px rgba(20,30,28,.16);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121817; --surface:#1b2322; --surface2:#242e2d; --ink:#e8eeec; --ink2:#9fadaa; --line:#34413f;
  --accent:#ff6a5f; --accent-ink:#1a0806;
  --land:#161d1c; --block:#1f2827; --road1:#3a4745; --road2:#2f3b39; --roadcase:#0f1514; --river:#264257;
  --g1:#4a9bff; --g2:#4cc27a; --g3:#f0c931; --g4:#f4f6f5; --g4ink:#e5383b; --gx:#f4f6f5; --gxink:#111111;
  --ring:#f4f6f5; --warn:#f0b04a; --danger:#ff6a5f; --ok:#4cc27a;
  --shadow:0 -6px 24px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121817; --surface:#1b2322; --surface2:#242e2d; --ink:#e8eeec; --ink2:#9fadaa; --line:#34413f;
  --accent:#ff6a5f; --accent-ink:#1a0806;
  --land:#161d1c; --block:#1f2827; --road1:#3a4745; --road2:#2f3b39; --roadcase:#0f1514; --river:#264257;
  --g1:#4a9bff; --g2:#4cc27a; --g3:#f0c931; --g4:#f4f6f5; --g4ink:#e5383b; --gx:#f4f6f5; --gxink:#111111;
  --ring:#f4f6f5; --warn:#f0b04a; --danger:#ff6a5f; --ok:#4cc27a;
  --shadow:0 -6px 24px rgba(0,0,0,.5); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.45;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono)}
#app{height:100%;display:flex;flex-direction:column;position:relative;padding-top:env(safe-area-inset-top,0px)}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{display:flex;align-items:center;gap:10px;padding-block:8px;background:var(--surface);border-bottom:1px solid var(--line);flex:0 0 auto}
header.top h1{font-size:16px;margin:0;font-weight:700;letter-spacing:-.01em;white-space:nowrap}
header.top .sub{font-size:12px;color:var(--ink2);white-space:nowrap}
.spacer{flex:1}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--surface2);color:var(--ink2);border:1px solid var(--line);white-space:nowrap}
.tag.demo{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,transparent)}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:8px;min-width:36px;height:36px;display:inline-flex;align-items:center;justify-content:center;padding:0 8px;font-weight:700}
main{flex:1 1 auto;min-height:0;position:relative}
.view{position:absolute;inset:0}
.view[hidden]{display:none}
#mapwrap{position:absolute;inset:0;background:var(--land);touch-action:none;overflow:hidden}
#tiles{position:absolute;inset:0;overflow:hidden;pointer-events:none}
#tiles img{position:absolute;left:0;top:0;max-width:none;transform-origin:0 0;user-select:none;-webkit-user-drag:none}
#windfx,#firefx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
#map{z-index:1;position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none}
.chips{position:absolute;left:0;right:0;top:8px;display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;z-index:2}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 11px 5px 7px;font-size:12px;font-weight:500;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.chip[aria-pressed="false"]{opacity:.55}
.chip.act{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);padding-left:11px;opacity:1}
.dot{width:16px;height:16px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;line-height:1;flex:0 0 auto}
.gd1{background:var(--g1);color:#fff}.gd2{background:var(--g2);color:#fff}.gd3{background:var(--g3);color:#241c00}
.gd4{background:var(--g4);color:var(--g4ink);border:1.5px solid var(--g4ink)}
.gdx{background:var(--gx);color:var(--gxink);border:1.5px solid var(--ring)}
.gde{background:transparent;border:1.5px dashed var(--ink2);color:var(--ink2)}
.mapctl{position:absolute;right:max(12px,env(safe-area-inset-right,0px));top:96px;display:flex;flex-direction:column;gap:6px;z-index:2}
.mapctl .iconbtn{box-shadow:0 1px 3px rgba(0,0,0,.25);font-size:18px;font-weight:500;min-width:44px;height:44px}
.mapctl .sm{font-size:12px}
.mapnote{position:absolute;left:max(12px,env(safe-area-inset-left,0px));bottom:6px;font-size:11px;color:var(--ink2);background:color-mix(in srgb,var(--surface) 90%,transparent);padding:2px 8px;border-radius:6px;z-index:2;max-width:75%}
.scalebar{position:absolute;left:max(12px,env(safe-area-inset-left,0px));bottom:30px;z-index:2;font-size:11px;color:var(--ink);pointer-events:none;background:color-mix(in srgb,var(--surface) 75%,transparent);padding:2px 6px;border-radius:4px}
.scalebar i{display:block;height:6px;border:2px solid var(--ink);border-top:none;margin-bottom:2px}
.wx{position:absolute;left:max(12px,env(safe-area-inset-left,0px));top:96px;z-index:2;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:7px 10px 7px 8px;box-shadow:0 1px 3px rgba(0,0,0,.25);text-align:left;max-width:calc(100% - 90px)}
.wx svg{width:34px;height:34px;flex:0 0 auto}
.wx .wxl{display:flex;flex-direction:column;line-height:1.3;min-width:0}
.wx b{font-size:14px;white-space:nowrap}
.wx .s{font-size:12px;color:var(--ink2);white-space:nowrap}
.wx .t{font-size:10.5px;color:var(--ink2);white-space:nowrap}
.sim{border:1.5px solid color-mix(in srgb,#e0431a 55%,var(--line));background:color-mix(in srgb,#e0431a 6%,var(--surface))}
.sim .top{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.sim .top b{font-size:14px}
.sim .lv{font-size:13px;font-weight:700;color:#c2410c;font-variant-numeric:tabular-nums}
.sim input[type=range]{width:100%;accent-color:#e0431a;margin:6px 0 0}
.sheet.compact .sbody>*:not(.sim){display:none}
.sheet.compact .sim label,.sheet.compact #simLevel,.sheet.compact .sim .ticks,.sheet.compact .sim .note,.sheet.compact .sim .kv>div:nth-child(n+3){display:none}
.sheet.compact .sim{margin-bottom:0}
.sim .top .tog{margin-left:auto;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:3px 10px;font-size:12px;font-weight:700}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0 4px}
.seg button{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 4px;font-weight:700;font-size:14px;line-height:1.2}
.seg button small{display:block;font-size:11px;font-weight:500;color:var(--ink2)}
.seg button[aria-pressed="true"]{border-color:#e0431a;background:#e0431a;color:#fff}
.seg button[aria-pressed="true"] small{color:#ffe3d6}
.sim .ticks{display:flex;justify-content:space-between;font-size:10.5px;color:var(--ink2);font-variant-numeric:tabular-nums;padding:0 2px}
.sim .play{display:flex;align-items:center;gap:10px;margin-top:10px}
.sim .play input{flex:1}
.sim .tl{min-width:92px;font-size:13px;text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.sim .kv{margin:10px 0 6px}
.sim .kv span{font-size:15px}
.firebar{position:absolute;left:12px;right:12px;top:48px;z-index:2;display:none;background:var(--accent);color:var(--accent-ink);border-radius:10px;padding:8px 12px;font-size:13px;font-weight:500;align-items:center;gap:8px}
.firebar.on{display:flex}
.firebar.alert{cursor:pointer;animation:pulse 1.6s ease-in-out infinite}
.firebar.alert u{text-decoration:none;margin-left:6px;font-weight:700;white-space:nowrap}
@keyframes pulse{50%{box-shadow:0 0 0 5px color-mix(in srgb,var(--accent) 35%,transparent)}}
@media (prefers-reduced-motion:reduce){.firebar.alert{animation:none}}
.kv.ops span{font-size:14px}
.kv.ops small{font-size:11px;color:var(--ink2);font-weight:400}
table.rt{width:100%;border-collapse:collapse;font-size:12.5px}
table.rt th{font-size:11px;color:var(--ink2);font-weight:700;text-align:left;padding:4px 4px;border-bottom:1px solid var(--line)}
table.rt td{padding:6px 4px;border-bottom:1px solid var(--line)}
.order ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:10px}
.order ul{margin:6px 0 0;padding-left:4px;list-style:none;display:flex;flex-direction:column;gap:6px}
.order ul li{background:var(--surface2);border-radius:8px;padding:6px 9px}
.order small{color:var(--ink2)}
.dirrow{display:flex;align-items:center;gap:8px}.dirrow input{flex:1;accent-color:#6d28d9}
details.algo summary{cursor:pointer}details.algo ol{padding-left:20px;margin:8px 0 0;font-size:12.5px;display:flex;flex-direction:column;gap:4px}
.firebar button{white-space:nowrap;flex:0 0 auto;margin-left:auto;background:transparent;border:1px solid currentColor;border-radius:6px;padding:3px 9px;color:inherit;font-size:12px}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:5;background:var(--surface);border-top-left-radius:16px;border-top-right-radius:16px;box-shadow:var(--shadow);max-height:56%;display:flex;flex-direction:column;border-top:1px solid var(--line)}
.sheet[hidden]{display:none}
.sheet{transition:transform .25s ease}
.sheet.min{transform:translateY(calc(100% - 78px))}
.sheet .grab{position:relative;height:26px;flex:0 0 auto;touch-action:none;cursor:grab}
.sheet .grab::before{content:"";position:absolute;left:50%;top:9px;width:44px;height:5px;margin-left:-22px;border-radius:3px;background:var(--ink2);opacity:.45}
.sheet .sh-head,.sheet .sim .top{touch-action:none}
.sheet .sbody{overflow-y:auto;padding-top:6px;padding-bottom:max(16px,env(safe-area-inset-bottom,0px));-webkit-overflow-scrolling:touch}
.sh-head{display:flex;gap:12px;align-items:center}
.badge{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:24px;flex:0 0 auto}
.badge.gde{background:var(--surface);border:3px dashed currentColor}
.sh-title{min-width:0}
.sh-title .id{font-family:var(--mono);font-size:13px;font-weight:500}
.sh-title .addr{color:var(--ink2);font-size:12px;overflow-wrap:anywhere}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin:12px 0}
.kv div{background:var(--surface2);border-radius:10px;padding:8px 10px;min-width:0}
.kv b{display:block;font-size:11px;font-weight:500;color:var(--ink2)}
.kv span{font-size:16px;font-weight:700}
.kv small{font-size:11px;color:var(--ink2);font-weight:400}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:700;font-size:13px;min-height:40px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.sm{padding:5px 10px;min-height:32px;font-size:12px}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.pill{display:inline-block;font-size:11px;font-weight:700;border-radius:99px;padding:1px 8px}
.pill.ok{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.pill.warn{background:color-mix(in srgb,var(--warn) 20%,transparent);color:var(--warn)}
.pill.bad{background:color-mix(in srgb,var(--danger) 18%,transparent);color:var(--danger)}
.pill.mute{background:var(--surface2);color:var(--ink2)}
h3{font-size:12px;letter-spacing:.04em;color:var(--ink2);margin:14px 0 6px;font-weight:700}
.scroll{position:absolute;inset:0;overflow-y:auto;background:var(--bg);padding-bottom:16px;-webkit-overflow-scrolling:touch}
.toolbar{position:sticky;top:0;background:var(--bg);padding-block:10px;z-index:3;display:flex;flex-direction:column;gap:8px}
.search{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:var(--surface)}
.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 4px;text-align:center;font-size:11px;color:var(--ink2)}
.stat b{display:block;font-size:17px;color:var(--ink);line-height:1.2}
.row{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;width:100%;text-align:left}
.row .dot{width:34px;height:34px;font-size:16px}
.row .mid{min-width:0;flex:1}
.row .mid .t{font-family:var(--mono);font-size:12.5px;font-weight:500}
.row .mid .a{font-size:12px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .r{text-align:right;font-size:12px;color:var(--ink2);white-space:nowrap}
.row .r b{display:block;color:var(--ink);font-size:14px}
nav.tabs{display:flex;background:var(--surface);border-top:1px solid var(--line);flex:0 0 auto;padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs button{flex:1;border:0;background:transparent;padding:10px 4px 9px;font-size:12px;font-weight:700;color:var(--ink2);display:flex;flex-direction:column;align-items:center;gap:2px;min-height:52px}
nav.tabs button[aria-selected="true"]{color:var(--accent)}
nav.tabs svg{width:22px;height:22px}
.modal{position:absolute;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column}
.modal[hidden]{display:none}
.modal .mh{display:flex;align-items:center;gap:8px;padding-block:10px;background:var(--surface);border-bottom:1px solid var(--line)}
.modal .mh h2{font-size:15px;margin:0;flex:1}
.modal .mb{flex:1;overflow-y:auto;padding-block:12px 24px}
.modal .mf{padding-block:10px;background:var(--surface);border-top:1px solid var(--line);display:flex;gap:8px;padding-bottom:max(10px,env(safe-area-inset-bottom,0px))}
.modal .mf .btn{flex:1}
.fld{display:flex;flex-direction:column;gap:4px;margin-bottom:12px;min-width:0}
.fld label,.fld .l{font-size:12px;font-weight:700;color:var(--ink2)}
.fld input,.fld select,.fld textarea{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 11px;min-width:0;width:100%}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.checks{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.checks label,.radios label{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 10px;font-size:13px;font-weight:500;color:var(--ink)}
.radios{display:grid;gap:8px}
.checks input,.radios input{width:18px;height:18px;accent-color:var(--accent);flex:0 0 auto}
.live{display:flex;align-items:center;gap:12px;background:var(--surface2);border-radius:12px;padding:10px 12px}
.live .dot{width:40px;height:40px;font-size:20px}
.fsec{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
.fsec>h3{margin-top:0}
.note{font-size:12px;color:var(--ink2)}
.toast{position:absolute;left:50%;transform:translateX(-50%);bottom:72px;background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:10px;font-size:13px;font-weight:500;z-index:50;max-width:88%}
.toast[hidden]{display:none}
.empty{color:var(--ink2);text-align:center;padding:36px 12px;font-size:13px}
.rec{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.rec .h{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.rec .h .mono{font-size:12.5px;font-weight:500}
.rec .m{font-size:12px;color:var(--ink2);margin-top:4px;overflow-wrap:anywhere}
@media (min-width:900px){
  .sheet{left:auto;right:16px;bottom:16px;width:400px;border-radius:16px;max-height:calc(100% - 32px)}
  .modal{left:auto;width:460px;right:0;border-left:1px solid var(--line)}
}
</style>
</head>
<body>
<div id="app">
  <header class="top gut">
    <div><h1>소방용수 관리지도</h1><div class="sub">김천시 · 성능 기반 관리체계 시범</div></div>
    <span class="tag demo" id="dataTag">예시 자료</span>
    <span class="spacer"></span>
    <button class="iconbtn" id="btnSet" aria-label="지도·자료 설정">설정</button>
  </header>
  <main>
    <section class="view" id="vMap">
      <div id="mapwrap">
        <div id="tiles"></div>
        <canvas id="windfx" aria-hidden="true"></canvas>
        <canvas id="firefx" aria-hidden="true"></canvas>
        <svg id="map" role="img" aria-label="소방용수시설 지도"></svg>
        <div class="chips gut" id="chips"></div>
        <div class="firebar gut" id="firebar"><span id="firetxt"></span><button id="fireoff">해제</button></div>
        <div class="mapctl">
          <button class="iconbtn" id="zin" aria-label="확대">+</button>
          <button class="iconbtn" id="zout" aria-label="축소">−</button>
          <button class="iconbtn sm" id="zfit">전체</button>
          <button class="iconbtn sm" id="zgps">내 위치</button>
          <button class="iconbtn sm" id="zbase">배경</button>
        </div>
        <div class="scalebar" id="scalebar"></div>
        <div class="mapnote" id="mapnote"></div>
        <button class="wx" id="wx" aria-label="현재 기상 (눌러서 새로고침)"><span class="wxl">기상 정보 확인 중…</span></button>
      </div>
      <div class="sheet" id="sheet" hidden><div class="grab"></div><div class="sbody gut" id="sheetBody"></div></div>
    </section>
    <section class="view" id="vList" hidden>
      <div class="scroll gut">
        <div class="toolbar"><input class="search" id="q" type="search" placeholder="식별번호·주소 검색" aria-label="검색"><div class="stats" id="stats"></div></div>
        <div id="listBody"></div>
      </div>
    </section>
    <section class="view" id="vRec" hidden>
      <div class="scroll gut">
        <div class="toolbar"><div style="display:flex;align-items:center;gap:8px"><b style="font-size:15px">현장 조사 기록</b><span class="tag">이 기기에 저장</span><span class="spacer"></span><button class="btn sm" id="btnCsv">CSV</button><button class="btn sm pri" id="btnNew">+ 조사 입력</button></div></div>
        <div id="recBody"></div>
      </div>
    </section>
    <div class="modal" id="form" hidden>
      <div class="mh gut"><button class="iconbtn" id="fClose" aria-label="닫기">✕</button><h2 id="fTitle"></h2></div>
      <div class="mb gut" id="fBody"></div>
      <div class="mf gut" id="fFoot"></div>
    </div>
    <div class="toast" id="toast" hidden></div>

function ll2w(lat,lon){const s=Math.sin(lat*Math.PI/180);return [(lon+180)/360,0.5-Math.log((1+s)/(1-s))/(4*Math.PI)]}
function w2ll(x,y){const n=Math.PI-2*Math.PI*y;return {lat:180/Math.PI*Math.atan(0.5*(Math.exp(n)-Math.exp(-n))),lon:x*360-180}}

const gradeOf=q=>q>=3000?"1":q>=2000?"2":q>=1000?"3":"4";
function calc(ps,pr,qf){
  if(![ps,pr,qf].every(Number.isFinite)||qf<=0||ps<=0||pr<0) return null;
  if(ps<=P_MIN) return {q:0,g:"X"};
  if(pr>=ps) return null;
  const q=qf*Math.pow((ps-P_MIN)/(ps-pr),EXP);
  return {q,g:gradeOf(q)};
}
function perf(h){
  if(h.measured){const c=calc(h.ps,h.pr,h.qf);return c?{q:c.q,g:c.g,est:false}:{q:0,g:"X",est:false}}
  const q=Number.isFinite(h.estQ)?h.estQ:0; return {q,g:gradeOf(q),est:true};
}
function kInfo(h){
  if(!h.measured||!h.kPrev||!h.pr) return null;
  const k=h.qf/Math.sqrt(h.pr), d=(k-h.kPrev)/h.kPrev*100;
  return {k,d,lvl:Math.abs(d)>=30?"bad":Math.abs(d)>=15?"warn":"ok"};
}

  else{fill=col;stroke="#ffffff";tc=p.g==="3"?"#241c00":"#fff"}

const ptrs=new Map(); let gest=null;

  gest={moved:0,sx:e.clientX,sy:e.clientY,cx:view.cx,cy:view.cy,z:view.z,d:0,mx:0,my:0};
  if(ptrs.size===2){const [a,b]=[...ptrs.values()];gest.d=Math.hypot(a.x-b.x,a.y-b.y)||1;gest.moved=99}

  if(!ptrs.has(e.pointerId)||!gest)return;

    const [a,b]=[...ptrs.values()],d=Math.hypot(a.x-b.x,a.y-b.y)||1;
    setZ(gest.z+Math.log2(d/gest.d)); draw();
  }else if(ptrs.size===1){
    const dx=e.clientX-gest.sx,dy=e.clientY-gest.sy; gest.moved=Math.max(gest.moved,Math.hypot(dx,dy));
    if(gest.moved>6){const k=256*Math.pow(2,view.z);view.cx=gest.cx-dx/k;view.cy=gest.cy-dy/k;draw()}
  }
});

function tap(cx,cy){

/* ───────── 화재 확산 가시화 (단순 타원 모델) ─────────
   화재 강도 1~10단계 → 화원 열방출률 Q (MW)
   무풍 확산속도 R0 = 0.2 + 0.018·Q  [m/min]  (24시간·100 MW·5 m/s일 때 풍하측 약 10 km가 되도록 잡은 가시화용 값)
   풍하(전방) Rh = R0·(1+0.5U), 풍상(후방) Rb = R0/(1+0.25U), 장단축비 LB = 1+0.15U (U: 풍속 m/s, LB ≤ 4)
   t분 후 화재 영역: 장반경 a=(Rh+Rb)t/2+r0, 단반경 b=a/LB, 중심은 화원에서 풍하측으로 (Rh−Rb)t/2
   화원 직경 D: HRRPUA 500 kW/m² 가정, 화염높이 L = 0.235Q^0.4 − 1.02D (Heskestad, Q[kW])

  /* 4) 화염 입자 — 전선을 따라 솟구치며 바람에 눕는 불꽃 */
  for(let i=0;i<N;i+=3){const p=front[i],dn=g.calm?1:(1+Math.cos(i/N*2*Math.PI))/2,r=Math.max(14,Math.min(16+lvl*4,g.b/FO.m*0.8))*0.55*(0.7+0.6*dn)*(0.85+0.3*Math.sin(t*6+i));

  const spawnN=Math.min(want-flames.length,Math.ceil(want*dt*1.6));
  for(let k=0;k<spawnN;k++){
    let src;
    if(spots.length&&Math.random()<0.18){const s=spots[(Math.random()*spots.length)|0],[sx,sy]=l2s(s.e,s.n),r=Math.max(4,(2+(T-s.t0)*g.R0*1.6)/FO.m),a=Math.random()*6.283;src=[sx+Math.cos(a)*r,sy+Math.sin(a)*r,0.6]}
    else{let i=(Math.random()*N)|0; if(!g.calm&&Math.random()<0.55){i=Math.round((Math.random()-0.5)*N*0.4);i=(i+N)%N}  /* 풍하측 전선에 더 많이 */
      const a=front[i],b=front[(i+1)%N],u=Math.random();src=[a[0]+(b[0]-a[0])*u,a[1]+(b[1]-a[1])*u,1]}
    flames.push({x:src[0]+(Math.random()-0.5)*6,y:src[1]+(Math.random()-0.5)*6,age:0,life:0.45+Math.random()*0.75,s:scale*(0.55+Math.random()*0.75)*src[2],w:0.7+Math.random()*0.5,ph:Math.random()*6.28});
  }
  const lean=Math.min(1.3,0.15+U/5);
  const ux=dwx*lean, uy=-1+dwy*lean, ul=Math.hypot(ux,uy)||1, rot=Math.atan2(ux/ul,-uy/ul);

    const k=f.age/f.life, grow=k<0.25?k/0.25:1-(k-0.25)/0.75*0.6, h=f.s*grow*(0.9+0.12*Math.sin(t*14+f.ph));

    const i=(g.calm?(Math.random()*N):(Math.random()-0.5)*N*0.5+N)|0, p=front[i%N];
    smoke.push({x:p[0],y:p[1],age:0,life:4+Math.random()*4,r:scale*0.6*(0.7+Math.random()*0.6)});
  }

  const spWant=Math.round(Math.min(90,10+lvl*7));
  while(sparks.length<spWant){
    let i=(Math.random()*N)|0; if(!g.calm&&Math.random()<0.7){i=Math.round((Math.random()-0.5)*N*0.3);i=(i+N)%N}
    const p=front[i]; sparks.push({x:p[0],y:p[1],age:0,life:0.4+Math.random()*1.4,k:0.35+Math.random()*0.7,j:Math.random()*6.28});

    const p=sparks[i], a=(g.calm?p.j:g.beta)+0.6*Math.sin(t*3+p.j), s=(g.calm?20:spd)*p.k;

}
function inEll(e,n,T){const g=simGeom(T),sb=Math.sin(g.beta),cb=Math.cos(g.beta),x=e*sb+n*cb,y=e*cb-n*sb;return ((x-g.c)/g.a)**2+(y/g.b)**2<=1}

function fxLoop(ts){
  requestAnimationFrame(fxLoop);
  const d=FXD;
  for(const [cv,cx] of [[wfx,wctx],[ffx,fctx]]) if(cv.width!==Math.round(W*d)||cv.height!==Math.round(Hh*d)){cv.width=Math.round(W*d);cv.height=Math.round(Hh*d);cx.setTransform(d,0,0,d,0,0);if(cv===wfx)parts=[]}
  const dt=Math.min(0.05,Math.max(0.001,(ts-wLast)/1000)); wLast=ts;
  const onMap=!$("#vMap").hidden&&!document.hidden;
  if(!onMap)return;
  const t=ts/1000;
  /* 시뮬레이션 시간 진행 */
  if(sim.play&&fire){sim.t=Math.min(SIM_TMAX,sim.t+dt*simRate(sim.t));if(sim.t>=SIM_TMAX)sim.play=false;
    if(sim.t>sim.fitT*0.85&&sim.fitT<SIM_TMAX)fitFire();draw();updSimUI()}
  /* 화염 */
  fireRender(dt,t);
  /* 바람 흐름 */
  const windAct=windOn&&wx&&wx.ws>=0.3&&!gest;
  if(!windAct){if(parts.length){clearFx();parts=[]}return}
  wctx.globalCompositeOperation="destination-out";wctx.fillStyle="rgba(0,0,0,0.09)";wctx.fillRect(0,0,W,Hh);
  wctx.globalCompositeOperation="source-over";
  const ws=wx.ws, gg=Math.max(0,(wx.wg||ws)-ws);
  const v=ws+gg*0.7*Math.pow(Math.max(0,Math.sin(t*0.9)),2);   /* 돌풍이 주기적으로 지나가는 효과 */
  const spd=Math.min(220,16+v*14), b=(wx.wd+180)*Math.PI/180;
  const n=Math.round(Math.min(280,W*Hh/1700*Math.min(1.6,0.55+ws/6)));
  while(parts.length<n){const p={};spawn(p);p.age=Math.random()*p.life;parts.push(p)}
  if(parts.length>n)parts.length=n;
  const onPhoto=base==="sat"||base==="vws";
  wctx.strokeStyle=onPhoto?"rgba(255,255,255,0.8)":"rgba(18,88,205,0.55)";
  wctx.lineWidth=1.6;wctx.lineCap="round";wctx.beginPath();
  for(const p of parts){
    const a=b+0.15*Math.sin(p.x*0.011+t*0.7)+0.1*Math.sin(p.y*0.016-t*0.5), s=spd*p.k;
    const nx=p.x+Math.sin(a)*s*dt, ny=p.y-Math.cos(a)*s*dt;
    wctx.moveTo(p.x,p.y);wctx.lineTo(nx,ny);p.x=nx;p.y=ny;p.age+=dt;
    if(p.age>p.life||nx<-30||nx>W+30||ny<-30||ny>Hh+30)spawn(p);

  if(!e.target.closest(".grab,.sh-head,.sim .top")||e.target.closest("button,input,a"))return;
  const r=sheetEl.getBoundingClientRect();
  sdrag={y:e.clientY,dy:0,id:e.pointerId,min:sheetEl.classList.contains("min"),h:r.height,grab:!!e.target.closest(".grab")};

function endSheet(e){

const q=v=>'"'+String(v??"").replace(/"/g,'""')+'"';
function download(name,text,type){
  const b=new Blob(["﻿"+text],{type:type||"text/csv;charset=utf-8"}),a=document.createElement("a");
  a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);

const HCOLS=["시설구분","식별번호","주소","유형","관경","관로","위도","경도","정압","잔류압","시험유량","시험일","추정유량","이전K","저수량"];
const STATION_KINDS=["소방서","119안전센터","안전센터","지역대","119지역대"];
const SOURCE_KINDS=["소화수조","저수조","급수탑","하천취수","취수점","저수지"];
function hydrantsCSV(){
  const rows=H.map(h=>["소화전",h.id,h.addr,h.type,h.dia,h.pipe,h.lat,h.lon,h.measured?h.ps:"",h.measured?h.pr:"",h.measured?h.qf:"",h.measured?h.date:"",h.measured?"":h.estQ,h.kPrev||"",""]);
  L.stations.forEach((s,i)=>rows.push([s.kind,s.id||"ST-"+(i+1),s.name,"","","",s.pos[0],s.pos[1],"","","","","","",""]));
  L.sources.forEach((s,i)=>rows.push([s.kind,s.id||"WS-"+(i+1),s.name,"","","",s.pos[0],s.pos[1],"","","","","","",s.vol??""]));
  return [HCOLS.map(q).join(","),...rows.map(r=>r.map(q).join(","))].join("\r\n");
}
function surveysCSV(){
  const head=["조사일","식별번호","조사자","이상항목","Ps(MPa)","Pr(MPa)","QF(L/min)","QR(L/min)","등급","위도","경도","메모"];
  return [head.map(q).join(","),...[...S].sort((a,b)=>(a.ts||0)-(b.ts||0)).map(r=>{
    const h=H.find(v=>v.id===r.hydrantId),p=r.newLoc||(h?{lat:h.lat,lon:h.lon}:null);
    return [r.date,r.hydrantId||"신규",r.who,(r.issues||[]).join("; "),r.ps,r.pr,r.qf,r.q,r.g,p?p.lat:"",p?p.lon:"",r.memo].map(q).join(",")}).filter(Boolean)].join("\r\n");
}
function parseCSV(t){
  t=t.replace(/^﻿/,"");const rows=[];let row=[],f="",inq=false;
  for(let i=0;i<t.length;i++){const c=t[i];
    if(inq){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else inq=false}else f+=c}
    else if(c==='"')inq=true;else if(c===","){row.push(f);f=""}
    else if(c==="\n"||c==="\r"){if(c==="\r"&&t[i+1]==="\n")i++;row.push(f);f="";if(row.some(x=>x!==""))rows.push(row);row=[]}
    else f+=c}
  row.push(f);if(row.some(x=>x!==""))rows.push(row);return rows;
}
function importHydrants(text){
  const rows=parseCSV(text);if(rows.length<2)throw new Error("자료 행이 없습니다");
  const hd=rows[0].map(s=>s.trim()),ix=n=>hd.indexOf(n);
  if(ix("식별번호")<0||ix("위도")<0||ix("경도")<0)throw new Error("‘식별번호·위도·경도’ 열이 필요합니다");
  const num=v=>{const n=parseFloat(String(v).replace(/,/g,""));return Number.isFinite(n)?n:null};
  const out=[],bad=[],stations=[],sources=[];
  rows.slice(1).forEach((r,i)=>{
    const g=n=>ix(n)<0?"":(r[ix(n)]??"").trim(),lat=num(g("위도")),lon=num(g("경도"));
    if(!g("식별번호")||lat==null||lon==null||lat<30||lat>40||lon<120||lon>135){bad.push(i+2);return}
    const kind=g("시설구분").replace(/\s/g,"");
    if(STATION_KINDS.includes(kind)){stations.push({id:g("식별번호"),name:g("주소")||g("식별번호"),kind,pos:[lat,lon]});return}
    if(SOURCE_KINDS.includes(kind)){sources.push({id:g("식별번호"),name:g("주소")||g("식별번호"),kind,pos:[lat,lon],vol:num(g("저수량"))});return}
    const ps=num(g("정압")),pr=num(g("잔류압")),qf=num(g("시험유량")),meas=ps!=null&&pr!=null&&qf!=null;
    const h={id:g("식별번호"),addr:g("주소")||"-",type:g("유형")||"",dia:num(g("관경"))||100,pipe:g("관로")||"",lat,lon,measured:meas};
    if(meas){h.ps=ps;h.pr=pr;h.qf=qf;h.date=g("시험일")}else h.estQ=num(g("추정유량"))||0;
    const kp=num(g("이전K"));if(kp)h.kPrev=kp;out.push(h);
  });
  if(!out.length)throw new Error("읽을 수 있는 소화전 행이 없습니다 (위도·경도 확인)");
  return {out,bad,stations,sources};
}

  fr.onload=()=>{try{
    const buf=new Uint8Array(fr.result);let text;
    try{text=new TextDecoder("utf-8",{fatal:true}).decode(buf)}catch(_){text=new TextDecoder("euc-kr").decode(buf)}   /* 엑셀 기본 CSV(CP949)도 읽기 */
    const {out,bad,stations,sources}=importHydrants(text);H=out;custom=true;saveH();
    L.stations=stations;L.sources=sources;ls.set("gc_layers",{stations,sources});markCustom();closeModal();selId=null;fire=null;$("#sheet").hidden=true;updateFirebar();fit();renderList();toast(`소화전 ${out.length}개소${stations.length?` · 소방관서 ${stations.length}`:""}${sources.length?` · 대체수원 ${sources.length}`:""}를 가져왔습니다`+(bad.length?" (제외 "+bad.length+"행: "+bad.slice(0,5).join(", ")+")":""))}catch(err){toast(err.message)}};
  fr.onerror=()=>toast("파일을 읽을 수 없습니다");
  fr.readAsArrayBuffer(f);e.target.value="";
};

/* ───────── 공통 ───────── */
let tt=0;
function toast(m){const t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,3200)}
function go(v){
  ["vMap","vList","vRec"].forEach(id=>$("#"+id).hidden=id!==v);
  document.querySelectorAll("nav.tabs button").forEach(b=>b.setAttribute("aria-selected",b.dataset.v===v));
  if(v==="vMap")requestAnimationFrame(()=>{size();draw()});
  if(v==="vList")renderList();if(v==="vRec")renderRec();
}
document.querySelectorAll("nav.tabs button").forEach(b=>b.onclick=()=>go(b.dataset.v));

/* 시작 */
size();buildChips();fit();renderList();renderRec();renderWx();setTimeout(()=>fetchWx(true),300);
$("#mapnote").textContent=BASES[base].name+" · "+BASES[base].att;
if(BASES[base].key&&!vkey)setBase("osm");
if(inFrame){setTimeout(()=>toast("미리보기 화면입니다. 지도·위성·GPS는 크롬 등 브라우저에서 열어야 보입니다"),600)}
window.addEventListener("load",()=>{size();fit()});
})();
</script>
